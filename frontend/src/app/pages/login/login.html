<div class="login-container">
  <div class="login-card">
    <div class="logo">
      <span>😊</span>
      <span class="logo-text">SmileUp</span>
    </div>
    <h1>Bienvenue</h1>
    <p class="subtitle">Connectez-vous à votre espace co-living</p>
    <form>
      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="">
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" placeholder="">
      </div>
      <button type="submit">Se connecter</button>
    </form>
    <p class="register-link">Pas encore membre ? <a href="/register">Créer un compte</a></p>
  </div>
</div>
